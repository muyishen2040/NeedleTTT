# Planned configuration; dataset loader is not implemented in the bootstrap.
dataset: amazon_reviews_2023_video_games_5core
external_item_id: parent_asin
split_seed: 17
train_fraction: 0.70
validation_fraction: 0.15
test_fraction: 0.15
catalog:
  max_items: 2000
  select_from_training_users_only: true
ranking:
  primary_metric: ndcg_at_10
  relevant_ratings: [4, 5]
  evaluate_full_eligible_catalog: true
model:
  embedding_dim: 16
  variants: [base, vector, matrix]
